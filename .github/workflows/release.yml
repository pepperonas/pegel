name: Release

# Push a tag like `v1.2.3` → this builds a signed release APK and
# publishes it as a downloadable GitHub Release asset. Future updates:
# bump versionName/versionCode in app/build.gradle.kts, then
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: ubuntu-latest ships the SDK (ANDROID_HOME), and
      # android-actions/setup-android@v3 broke on 2026-09-27 — it installs the removed
      # 'tools' package, which sdkmanager 16.0 rejects.

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Resolve version
        id: ver
        run: |
          NAME="$GITHUB_REF_NAME"
          if ! printf '%s' "$NAME" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "Invalid version/tag: '$NAME' (expected like v1.2.3)" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      # The release page carries the CHANGELOG section of this version; a tag without one fails
      # here instead of publishing an empty page.
      - name: Release notes
        run: scripts/release-notes.sh "${{ steps.ver.outputs.name }}" > RELEASE_NOTES.md

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Remove the key as soon as the APK is signed — before any third-party action runs.
      - name: Clean up keystore
        if: always()
        run: rm -f release.jks

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "pegel-${{ steps.ver.outputs.name }}.apk"
          sha256sum "pegel-${{ steps.ver.outputs.name }}.apk" | tee SHA256SUMS.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "pegel-${{ steps.ver.outputs.name }}.apk" | tee -a "$GITHUB_STEP_SUMMARY" | tee certs.txt
          # Every release is signed with the same key — Android refuses an update signed
          # differently. The expected SHA-256 lives in the repository variable SIGNING_CERT_SHA256
          # (not a secret: it is the public fingerprint). Unset or different = no release.
          EXPECTED="${{ vars.SIGNING_CERT_SHA256 }}"
          [ -n "$EXPECTED" ] || { echo "Repository variable SIGNING_CERT_SHA256 is not set" >&2; exit 1; }
          grep -qi "SHA-256 digest: $EXPECTED" certs.txt \
            || { echo "Unexpected signing certificate" >&2; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          name: Pegel ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            pegel-${{ steps.ver.outputs.name }}.apk
            SHA256SUMS.txt
